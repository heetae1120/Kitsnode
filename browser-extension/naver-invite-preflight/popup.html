<!doctype html><html lang="ko"><head><meta charset="utf-8"><title>광고계정 연결 시험</title>
<style>body{width:300px;margin:16px;font:14px/1.5 system-ui,sans-serif;color:#202020}button{display:block;width:100%;margin:8px 0;padding:9px;cursor:pointer}p{margin:10px 0}.status{min-height:3em}</style></head>
<body><strong>광고계정 연결 시험</strong><p>네이버 애즈에서 직접 로그인하고 광고계정의 권한 관리 화면을 여세요.</p>
<button id="open" type="button">네이버 애즈 열기</button><button id="prepare" type="button">현재 탭에서 초대 화면 준비</button>
<button id="auto" type="button">초대 자동 진행 시작</button>
<p>회원 초대 정책은 직접 확인하고 동의해 주세요. 초대 대상은 <strong>kitsnode</strong>입니다.</p>
<button id="lookup" type="button">kitsnode ID 입력</button><button id="next" type="button">권한 선택으로 이동</button><button id="send" type="button">운영 관리 초대 보내기</button>
<button id="diagnose" type="button">현재 화면 확인 (발송 안 함)</button>
<p>발송 버튼은 확인 후 한 번만 시도합니다. 결과가 불확실하면 네이버에서 직접 확인해 주세요.</p>
<p id="status" class="status" role="status" aria-live="polite">수락은 자동으로 수행하지 않습니다.</p>
<script type="module" src="popup.mjs"></script></body></html>
