name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Set GitHub Pages path
        env:
          REPOSITORY_NAME: ${{ github.event.repository.name }}
          OWNER: ${{ github.repository_owner }}
        run: |
          if [ "${REPOSITORY_NAME,,}" = "${OWNER,,}.github.io" ]; then
            echo "PAGES_BASE_PATH=" >> "$GITHUB_ENV"
          else
            echo "PAGES_BASE_PATH=/$REPOSITORY_NAME" >> "$GITHUB_ENV"
          fi
      - name: Restore Next.js build cache
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: ${{ runner.os }}-pages-next-${{ hashFiles('package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-pages-next-${{ hashFiles('package-lock.json') }}-
      - name: Test and build static site
        shell: bash
        run: |
          npm test &
          test_pid=$!
          npm run build &
          build_pid=$!
          test_status=0
          build_status=0
          wait "$test_pid" || test_status=$?
          wait "$build_pid" || build_status=$?
          if (( test_status != 0 || build_status != 0 )); then
            echo "Test exit code: $test_status; build exit code: $build_status"
            exit 1
          fi
        env:
          NEXT_PUBLIC_KEYWORD_API_URL: https://kitsnode.vercel.app/api/keywords
      - run: npm run typecheck
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
